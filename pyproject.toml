[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftguard-ai"
version = "0.1.0"
description = "Agentic AWS drift remediation that validates Terraform and opens GitHub pull requests."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.60",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.3.0",
  "pydantic>=2.7.0",
  "PyGithub>=2.5.0",
  "boto3>=1.35.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
driftguard = "driftguard:main"

[tool.setuptools]
py-modules = ["driftguard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
